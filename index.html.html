<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="logo-pwa.png">
  <link rel="apple-touch-icon" href="logo-pwa.png">
  <title>Busca Fiscal — Inteligência Tributária</title>
  <meta name="description" content="Busca inteligente de CNAE, NCM, ISS e Alíquotas com IA da ACQ Soluções.">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #16161f;
      --border: #1e1e2e;
      --border-hi: #2d2d42;
      --green: #00c49a;
      --green-hi: #00e5b5;
      --green-dim: rgba(0, 196, 154, 0.14);
      --blue: #7eb8ff;
      --blue-dim: rgba(126, 184, 255, 0.12);
      --text: #e2e2f0;
      --muted: #6b6b88;
      --dim: #3a3a55;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
      --radius: 5px;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #splash-logo {
      width: 180px;
      height: auto;
      animation: splash-pulse 2s infinite ease-in-out;
      filter: drop-shadow(0 0 20px rgba(0, 196, 154, 0.2));
    }

    @keyframes splash-pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.9;
      }

      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    #install-banner {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: var(--surface2);
      border: 1px solid var(--border-hi);
      padding: 15px;
      border-radius: 12px;
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.4s ease forwards;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .install-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
    }

    .install-text {
      flex: 1;
      font-size: 13px;
      color: var(--text);
    }

    .install-btn {
      background: var(--green);
      color: #000;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    /* ── TOP BAR ── */
    .topbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 32px;
      background: rgba(10, 10, 15, 0.96);
      border-bottom: 1px solid var(--border-hi);
      backdrop-filter: blur(10px);
      min-height: 80px;
    }

    .topbar-logo a {
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .topbar-logo img {
      height: 56px;
      width: auto;
      display: block;
    }

    /* Dynamic tagline */
    .tagline-wrap {
      flex: 1;
      overflow: hidden;
      min-width: 0;
    }

    .tagline {
      font-family: var(--sans);
      font-size: clamp(12px, 1.4vw, 16px);
      font-weight: 400;
      color: #fff;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      white-space: normal;
    }

    .tagline.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .tagline.hidden {
      opacity: 0;
      transform: translateY(-8px);
    }

    .tagline em {
      color: var(--green);
      font-style: normal;
      font-weight: 500;
    }

    /* ── MAIN WRAP ── */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 36px 24px 80px;
    }

    /* ── HERO: title left + promo right ── */
    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 28px;
      align-items: stretch;
      margin-bottom: 32px;
    }

    @media(max-width:620px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }

    .hero-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      min-height: 160px;
    }

    .hero-text .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green);
      border: 1px solid rgba(0, 196, 154, 0.35);
      padding: 3px 10px;
      border-radius: 2px;
      margin-bottom: 14px;
      width: fit-content;
    }

    h1 {
      font-family: var(--mono);
      font-size: clamp(20px, 3.2vw, 32px);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    h1 .x {
      color: var(--green);
    }

    h1 .nb {
      color: var(--blue);
    }

    .subtitle {
      font-size: clamp(12px, 1.3vw, 15px);
      color: var(--muted);
      font-weight: 300;
      line-height: 1.6;
    }

    /* ── PROMO WIDGET ── */
    .promo {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 320px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-hi);
      box-shadow: 0 6px 32px rgba(0, 0, 0, 0.55);
      gap: 0;
      background: #006e55;
    }

    .promo-gif {
      width: 100%;
      display: block;
      object-fit: cover;
      flex-shrink: 0;
      line-height: 0;
      font-size: 0;
    }

    /* 3D volumetric button */
    .promo-btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      padding: 9px 16px;
      border-radius: 0;
      line-height: 1.3;
      position: relative;
      cursor: pointer;
      flex: 1;
      background: linear-gradient(180deg,
          #00ddb0 0%,
          #00b890 40%,
          #009070 80%,
          #006e55 100%);
      box-shadow:
        0 2px 0 rgba(255, 255, 255, 0.3) inset,
        0 -2px 0 rgba(0, 0, 0, 0.3) inset;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      transition: filter .12s;
    }

    .promo-btn:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .promo-btn:active {
      filter: brightness(0.92);
      transform: translateY(1px);
    }

    @media(max-width:620px) {
      .promo {
        width: 100%;
      }
    }

    /* Search */
    .search-wrap {
      margin-bottom: 22px;
    }

    .search-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      display: block;
      margin-bottom: 8px;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border-hi);
      color: var(--text);
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 500;
      padding: 12px 16px;
      border-radius: var(--radius);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      letter-spacing: .06em;
    }

    .search-input::placeholder {
      color: var(--dim);
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0;
    }

    .search-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-dim);
    }

    .btn-clear {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      padding: 0 16px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }

    .btn-clear:hover {
      border-color: var(--green);
      color: var(--green);
    }

    /* Count */
    .count-bar {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .count-bar strong {
      color: var(--green);
    }

    /* Cards */
    #results {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: fadeUp .2s ease forwards;
      opacity: 0;
      transform: translateY(5px);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .cnae-code {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--green);
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .cnae-desc {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
    }

    .card-body {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    }

    @media(max-width:720px) {
      .card-body {
        grid-template-columns: 1fr;
      }
    }

    .section {
      padding: 13px 16px;
    }

    .section+.section {
      border-left: 1px solid var(--border);
    }

    @media(max-width:560px) {
      .section+.section {
        border-left: none;
        border-top: 1px solid var(--border);
      }
    }

    .section-title {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .section-title.iss-title {
      color: var(--green);
    }

    .section-title.nbs-title {
      color: var(--blue);
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-green {
      background: var(--green);
    }

    .dot-blue {
      background: var(--blue);
    }

    .iss-list,
    .nbs-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .no-iss {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
      font-style: italic;
    }

    .iss-item,
    .nbs-item {
      display: flex;
      gap: 7px;
      align-items: flex-start;
    }

    .iss-badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      background: rgba(0, 196, 154, 0.15);
      border: 1px solid rgba(0, 196, 154, 0.3);
      padding: 2px 6px;
      border-radius: 2px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .nbs-badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      background: rgba(126, 184, 255, 0.15);
      border: 1px solid rgba(126, 184, 255, 0.25);
      padding: 2px 6px;
      border-radius: 2px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .iss-desc,
    .nbs-desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }

    .no-nbs {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
      font-style: italic;
    }

    .orange {
      --oc: rgba(255, 179, 71, 0.9);
    }

    .section-title.simples-title {
      color: #ffb347;
    }

    .dot-orange {
      background: #ffb347;
    }

    .simples-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .simples-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .simples-badge {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: #0a0a0f;
      background: #ffb347;
      padding: 2px 8px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .simples-pill {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .pill-fatorr-sim {
      background: rgba(0, 229, 160, 0.15);
      border: 1px solid rgba(0, 229, 160, 0.3);
      color: #00e5a0;
    }

    .pill-fatorr-nao {
      background: rgba(107, 107, 136, 0.15);
      border: 1px solid rgba(107, 107, 136, 0.3);
      color: #6b6b88;
    }

    .pill-aliquota {
      background: rgba(255, 179, 71, 0.15);
      border: 1px solid rgba(255, 179, 71, 0.3);
      color: #ffb347;
    }

    .no-simples {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
      font-style: italic;
    }

    .simples-hint {
      font-size: 11px;
      color: var(--muted);
      cursor: help;
      margin-left: 4px;
      vertical-align: middle;
    }

    .simples-hint:hover {
      color: #ffb347;
    }

    mark {
      background: rgba(0, 196, 154, 0.22);
      color: var(--green-hi);
      border-radius: 2px;
      padding: 0 1px;
    }

    .pager {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .pg {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--surface);
      border: 1px solid var(--border-hi);
      color: var(--muted);
      padding: 5px 11px;
      border-radius: 3px;
      cursor: pointer;
      transition: all .15s;
    }

    .pg:hover,
    .pg.active {
      border-color: var(--green);
      color: var(--green);
    }

    .pg:disabled {
      opacity: .3;
      cursor: default;
      pointer-events: none;
    }

    .pg-sep {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
      padding: 5px 2px;
    }

    .empty {
      text-align: center;
      padding: 60px 0;
      color: var(--dim);
      font-family: var(--mono);
      font-size: 13px;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-hi);
      border-radius: 3px;
    }

    /* ── TABS ── */
    :root {
      --violet: #a78bfa;
      --violet-hi: #c4b5fd;
      --violet-dim: rgba(167, 139, 250, 0.12);
      --orange-ncm: #fb923c;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border: 1px solid var(--border-hi);
      background: linear-gradient(180deg, var(--surface2) 0%, var(--surface) 100%);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .15s;
      letter-spacing: .05em;
      box-shadow: 0 2px 0 rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .06);
      position: relative;
      top: 0;
    }

    .tab-btn:hover {
      color: var(--text);
      background: linear-gradient(180deg, #1e1e2a 0%, #16161f 100%);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .tab-btn:active {
      top: 1px;
      box-shadow: 0 1px 0 rgba(0, 0, 0, .5), inset 0 1px 2px rgba(0, 0, 0, .3);
    }

    .tab-btn.active.cnae-tab {
      border-color: var(--green);
      color: var(--green);
      background: linear-gradient(180deg, rgba(0, 196, 154, .18) 0%, rgba(0, 196, 154, .08) 100%);
      box-shadow: 0 2px 0 rgba(0, 80, 60, .7), 0 0 8px rgba(0, 196, 154, .15), inset 0 1px 0 rgba(0, 229, 181, .15);
      top: 1px;
    }

    .tab-btn.active.ncm-tab {
      border-color: var(--violet);
      color: var(--violet);
      background: linear-gradient(180deg, rgba(167, 139, 250, .18) 0%, rgba(167, 139, 250, .08) 100%);
      box-shadow: 0 2px 0 rgba(80, 50, 150, .7), 0 0 8px rgba(167, 139, 250, .15), inset 0 1px 0 rgba(196, 181, 253, .15);
      top: 1px;
    }

    .tab-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 4px currentColor;
    }

    /* ── NCM SEARCH ── */
    .ncm-autocomplete {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--violet);
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
      z-index: 200;
      overflow: hidden;
      max-height: 260px;
      overflow-y: auto;
    }

    .ncm-autocomplete::-webkit-scrollbar {
      width: 4px;
    }

    .ncm-autocomplete::-webkit-scrollbar-track {
      background: var(--surface2);
    }

    .ncm-autocomplete::-webkit-scrollbar-thumb {
      background: var(--border-hi);
      border-radius: 2px;
    }

    .ncm-ac-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .12s;
    }

    .ncm-ac-item:last-child {
      border-bottom: none;
    }

    .ncm-ac-item:hover,
    .ncm-ac-item.ac-active {
      background: var(--violet-dim);
    }

    .ncm-ac-code {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--violet-hi);
      white-space: nowrap;
      min-width: 80px;
    }

    .ncm-ac-desc {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ncm-ac-unit {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      white-space: nowrap;
      margin-left: auto;
      padding-left: 8px;
    }

    .ncm-ac-hint {
      padding: 8px 14px;
      font-size: 11px;
      color: var(--dim);
      font-style: italic;
    }

    #ncm-section {
      display: none;
    }

    .ncm-label {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--violet);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .ncm-hint {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      font-style: italic;
    }

    .ncm-search-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .ncm-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-family: var(--mono);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border .2s;
      letter-spacing: .06em;
    }

    .ncm-input:focus {
      border-color: var(--violet);
    }

        const issHtml = r.noISS ? '<span class="no-iss">ISS não se aplica a esta atividade (comércio / indústria)</span>' : r.items.map(it => `<div class="iss-item"><span class="iss-badge">${esc(it.item)}</span><span class="iss-desc">${hl(it.descItem, q)}</span></div>`).join('');
        const nbsHtml = nbsList.length
          ? nbsList.map(n => `<div class="nbs-item"><span class="nbs-badge">${esc(n.codigo)}</span><span class="nbs-desc">${esc(n.descricao)}</span></div>`).join('')
          : '<span class="no-nbs">Sem mapeamento NBS disponível</span>';
        const simplesKey = getNbsKey(r.cnae);
        const simplesList = SIMPLES_MAP[simplesKey] || [];
        const simplesHtml = simplesList.length
          ? simplesList.map(s => `<div class="simples-row"><span class="simples-badge">Anexo ${esc(s.anexo)}</span><span class="simples-pill pill-aliquota">Alíquota: ${esc(s.aliquota)}%</span><span class="simples-pill ${s.fatorR === 'Sim' ? 'pill-fatorr-sim' : 'pill-fatorr-nao'}">Fator R: ${esc(s.fatorR)}</span></div>`).join('')
          : '<span class="no-simples">Não consta no Simples Nacional</span>';
        return `<div class="card" style="animation-delay:${idx * 18}ms">
      <div class="card-header"><span class="cnae-code">${hl(r.cnae, q)}</span><span class="cnae-desc">${hl(r.descCnae, q)}</span></div>

        <div class="section"><div class="section-title nbs-title"><span class="dot dot-blue"></span>NBS possíveis</div><div class="nbs-list">${nbsHtml}</div></div>
        <div class="section"><div class="section-title simples-title"><span class="dot dot-orange"></span>Simples Nacional <span class="simples-hint" title="Se a empresa for optante do Simples Nacional, esta é a provável faixa de enquadramento. O regime real depende do faturamento, composição societária e outros critérios da LC 123/2006.">ⓘ</span></div><div class="simples-list">${simplesHtml}</div></div>
      </div></div>`;
      }).join('');
      const pg = document.getElementById('pager');
      if (pages <= 1) { pg.innerHTML = ''; return; }
      let h = `<button class="pg" ${page === 1 ? 'disabled' : ''} onclick="go(${page - 1})">←</button>`;
      let f = Math.max(1, page - 2), t = Math.min(pages, page + 2);
      if (f > 1) { h += `<button class="pg" onclick="go(1)">1</button>`; if (f > 2) h += `<span class="pg-sep">…</span>`; }
      for (let p = f; p <= t; p++) h += `<button class="pg ${p === page ? 'active' : ''}" onclick="go(${p})">${p}</button>`;
      if (t < pages) { if (t < pages - 1) h += `<span class="pg-sep">…</span>`; h += `<button class="pg" onclick="go(${pages})">${pages}</button>`; }
      h += `<button class="pg" ${page === pages ? 'disabled' : ''} onclick="go(${page + 1})">→</button>`;
      pg.innerHTML = h;
    }

    function lookupUnit(ncm) {
      const d = (ncm || '').replace(/\D/g, '');
      if (!d) return null;
      if (NCM_UNIT_SPEC[d.slice(0, 8)]) return NCM_UNIT_SPEC[d.slice(0, 8)];

    /* ─── AUTOCOMPLETE ─── */
    let acTimer, acCache = {}, acIndex = -1, acItems = [];

    function fmtNcmAc(c) {
      if (!c || c.length < 8) return c || '';
      return c.slice(0, 4) + '.' + c.slice(4, 6) + '.' + c.slice(6, 8);
    }

    function showAc(items) {
      const box = document.getElementById('ncm-autocomplete');
      acItems = items;
      acIndex = -1;
      if (!items.length) { box.style.display = 'none'; return; }
      box.innerHTML = items.map((it, i) => {
        const unit = lookupUnit(it.codigo);
        const rawDesc = it.descricao || '';
        const desc = rawDesc.charAt(0).toUpperCase() + rawDesc.slice(1).toLowerCase();
        return `<div class="ncm-ac-item" data-i="${i}" onmousedown="pickAc(${i})">
      <span class="ncm-ac-code">${fmtNcmAc(it.codigo)}</span>
      <span class="ncm-ac-desc">${desc}</span>
      ${unit ? `<span class="ncm-ac-unit">${unit}</span>` : ''}
    </div>`;
      }).join('');
      box.style.display = 'block';
    }

    function hideAc() {
      document.getElementById('ncm-autocomplete').style.display = 'none';
      acItems = []; acIndex = -1;
    }

    function pickAc(i) {
      const it = acItems[i];
      if (!it) return;
      const inp = document.getElementById('ncm-q');
      inp.value = it.codigo;
      hideAc();
      clearTimeout(acTimer);
      doNcmSearch(it.codigo);
    }

    function moveAc(dir) {
      const box = document.getElementById('ncm-autocomplete');
      const rows = box.querySelectorAll('.ncm-ac-item');
      if (!rows.length) return false;
      rows[acIndex]?.classList.remove('ac-active');
      acIndex = Math.max(0, Math.min(rows.length - 1, acIndex + dir));
      rows[acIndex]?.classList.add('ac-active');
      rows[acIndex]?.scrollIntoView({ block: 'nearest' });
      return true;
    }

    async function fetchAc(digits) {
      if (acCache[digits]) return acCache[digits];
      try {
        const r = await fetch(`https://brasilapi.com.br/api/ncm/v1/${encodeURIComponent(digits)}`, { mode: 'cors', credentials: 'omit' });
        if (!r.ok) return [];
        const d = await r.json();
        const arr = Array.isArray(d) ? d : (d && d.codigo ? [d] : []);
        acCache[digits] = arr.slice(0, 12);
        return acCache[digits];
      } catch { return []; }
    }

    function triggerAc(val) {
      const digits = val.replace(/\D/g, '');
      if (ncmMode !== 'code' || digits.length < 2 || digits.length >= 8) {
        hideAc(); return;
      }
      clearTimeout(acTimer);
      acTimer = setTimeout(async () => {
        const items = await fetchAc(digits);
        // só mostra se o input ainda bate com o que foi digitado
        const cur = document.getElementById('ncm-q').value.replace(/\D/g, '');
        if (cur === digits) showAc(items);
      }, 220);
    }

      document.getElementById('ncm-q').placeholder = m === 'code'
        ? 'Ex: 4011   →   autocomplete ativo...'
        : 'Ex: calçados de couro masculino...';
      clearNcm();

    function clearNcm() {
      document.getElementById('ncm-q').value = '';

    function fmtNcm(c) {
      if (!c || c.length < 8) return c || '';
      return c.slice(0, 4) + '.' + c.slice(4, 6) + '.' + c.slice(6, 8) + (c.length > 8 ? '.' + c.slice(8) : '');

    function fmtDate(d) {

      const p = d.split('-');
      if (p.length !== 3) return d;
      if (p[0] === '9999') return 'Vigente';
      return p[2] + '/' + p[1] + '/' + p[0];
    }

    function buildNcmCard(item) {
      const co = fmtNcm(item.codigo) || '—';
      const raw = item.descricao || 'Sem descrição';
      const desc = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
      const ii = item.aliquota_ii !== undefined ? item.aliquota_ii + '%' : '—';
      const ipi = item.aliquota_ipi !== undefined ? item.aliquota_ipi + '%' : '—';
      const pis = item.aliquota_pis !== undefined ? item.aliquota_pis + '%' : '—';
      const cof = item.aliquota_cofins !== undefined ? item.aliquota_cofins + '%' : '—';
      const ato = item.tipo_ato && item.numero_ato ? `${item.tipo_ato} nº ${item.numero_ato}` : null;
      const inicio = fmtDate(item.data_inicio);
      const fim = fmtDate(item.data_fim);
      const zc = v => parseFloat(v) === 0 ? 'zero' : '';

      // Ex-Tarifário
      const exNum = item.ex !== undefined && item.ex !== null && item.ex !== 0 ? item.ex : null;
      const exHtml = exNum
        ? `<div style="display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.3);border-radius:6px;padding:4px 8px">
        <span style="color:var(--violet-hi);font-family:var(--mono);font-size:12px;font-weight:700">EX-${String(exNum).padStart(2, '0')}</span>
        <span style="font-size:10px;color:var(--muted)">Tributação diferenciada</span>
      </div>`
        : `<div style="font-size:11px;color:var(--dim);margin-top:8px">Ex-Tarifário: não aplicável</div>`;

      // Unidade de medida
      const unitCode = lookupUnit(item.codigo);
      const unitLabel = unitCode ? (NCM_UNIT_LABEL[unitCode] || unitCode) : null;
      const unitHtml = unitCode
        ? `<div style="display:flex;align-items:center;gap:6px;margin-top:8px">
        <span style="background:rgba(126,184,255,.12);color:var(--blue);border:1px solid rgba(126,184,255,.25);border-radius:4px;padding:2px 7px;font-family:var(--mono);font-size:12px;font-weight:700">${unitCode}</span>
        <span style="font-size:11px;color:var(--muted)">${unitLabel}</span>
      </div>
      <div style="font-size:10px;color:var(--dim);margin-top:3px;font-family:var(--mono)">TEC — Uso fiscal/importação</div>`
        : `<div style="font-size:11px;color:var(--dim);margin-top:8px">Unidade não mapeada</div>`;

      // CEST lookup
      const cests = lookupCest(item.codigo);
      let cestHtml;
      if (cests && cests.length) {
        cestHtml = cests.map(c => `
      <div style="margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
          <span style="font-family:var(--mono);font-size:13px;font-weight:700;color:#fb923c;letter-spacing:.03em">${c.cest}</span>
          <span style="background:rgba(251,146,60,.15);color:#fb923c;border:1px solid rgba(251,146,60,.3);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600">ST</span>
        </div>
        <div style="font-size:11px;color:var(--muted);line-height:1.4">${c.segmento}</div>
        <div style="font-size:11px;color:var(--dim);line-height:1.4;margin-top:2px">${c.descricao}</div>
      </div>`).join('');
        cestHtml += `<div style="font-size:10px;color:var(--dim);margin-top:4px;font-family:var(--mono)">Conv. ICMS 92/2015</div>`;
      } else {
        cestHtml = `<div style="color:var(--dim);font-size:11px;line-height:1.5">Não localizado na<br>tabela CEST<br><span style="font-size:10px;font-family:var(--mono)">Conv. ICMS 92/2015</span></div>`;
      }

      return `<div class="ncm-card">
    <div class="ncm-card-header">
      <span class="ncm-code">${co}</span>
      <span class="ncm-desc">${desc}</span>
    </div>
    <div class="ncm-body" style="grid-template-columns:1fr 1fr 1fr 1fr">
      <div class="ncm-col">
        <div class="ncm-col-title"><span style="width:7px;height:7px;border-radius:50%;background:var(--violet);display:inline-block;margin-right:5px;"></span>Alíquotas Federais</div>
        <div class="ncm-aliq-row"><span class="ncm-aliq-label">II (Importação)</span><span class="ncm-aliq-value ${zc(item.aliquota_ii)}">${ii}</span></div>
        <div class="ncm-aliq-row"><span class="ncm-aliq-label">IPI</span><span class="ncm-aliq-value ${zc(item.aliquota_ipi)}">${ipi}</span></div>
        <div class="ncm-aliq-row"><span class="ncm-aliq-label">PIS</span><span class="ncm-aliq-value ${zc(item.aliquota_pis)}">${pis}</span></div>
        <div class="ncm-aliq-row"><span class="ncm-aliq-label">COFINS</span><span class="ncm-aliq-value ${zc(item.aliquota_cofins)}">${cof}</span></div>
        <div class="ncm-col-title" style="margin-top:14px"><span style="width:7px;height:7px;border-radius:50%;background:var(--blue);display:inline-block;margin-right:5px;"></span>Unidade (TEC)</div>
        ${unitHtml}
      </div>
      <div class="ncm-col">
        <div class="ncm-col-title"><span style="width:7px;height:7px;border-radius:50%;background:#fb923c;display:inline-block;margin-right:5px;"></span>CEST / Sub. Tributária</div>
        ${cestHtml}
      </div>
      <div class="ncm-col">
        <div class="ncm-col-title"><span style="width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;"></span>Vigência</div>
        <div class="ncm-vig-item">Início: <strong>${inicio}</strong></div>
        <div class="ncm-vig-item">Fim: <strong>${fim}</strong></div>
        <div class="ncm-col-title" style="margin-top:14px"><span style="width:7px;height:7px;border-radius:50%;background:var(--violet-hi);display:inline-block;margin-right:5px;"></span>Ex-Tarifário</div>
        ${exHtml}
      </div>
      <div class="ncm-col">
        <div class="ncm-col-title"><span style="width:7px;height:7px;border-radius:50%;background:var(--orange-ncm);display:inline-block;margin-right:5px;"></span>Base Legal</div>
        ${ato ? `<div class="ncm-ato-badge">📄 ${ato}</div>` : '<div style="color:var(--dim);font-size:11px">Não informado</div>'}
        <div style="margin-top:12px;font-size:10px;color:var(--dim);font-family:var(--mono)">Fonte: Receita Federal<br>via BrasilAPI</div>
      </div>
    </div>
  </div>`;
    }

    /* ── Busca inteligente NCM ── */
    function ncmNorm(str) {
      // Remove acentos, converte para minúsculas, elimina hifens e pontuação
      return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase().replace(/[-–—]/g, ' ').replace(/[^a-z0-9 ]/g, ' ')
        .replace(/\s+/g, ' ').trim();
    }

    async function apiSearch(q) {
      const url = `https://brasilapi.com.br/api/ncm/v1?search=${encodeURIComponent(q)}`;
      const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
      if (res.status === 404) return [];
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();
      return Array.isArray(d) ? d : (d && d.codigo ? [d] : []);
    }

    function dedup(arr) {
      const seen = new Set(); return arr.filter(x => { if (seen.has(x.codigo)) return false; seen.add(x.codigo); return true; });
    }

    // Score how well an item matches the query words
    function scoreItem(item, words) {
      const hay = ncmNorm((item.descricao || '') + (item.codigo || ''));
      let s = 0;
      for (const w of words) {
        if (hay.includes(w)) s += w.length >= 5 ? 3 : w.length >= 3 ? 2 : 1;
      }
      return s;
    }

    async function doNcmSearch(val) {
      const status = document.getElementById('ncm-status');
      const results = document.getElementById('ncm-results');
      if (!val.trim()) { results.innerHTML = ''; status.innerHTML = ''; return; }

      status.innerHTML = '<span class="ncm-spin"></span>Consultando BrasilAPI...';
      results.innerHTML = '';

      try {
        // ── MODO CÓDIGO ──
        if (ncmMode === 'code') {
          const code = val.replace(/\D/g, '');
          if (code.length < 2) { status.innerHTML = '<span style="color:var(--muted)">Digite ao menos 2 dígitos.</span>'; return; }
          const url = `https://brasilapi.com.br/api/ncm/v1/${encodeURIComponent(code)}`;
          const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
          if (!res.ok) {
            if (res.status === 404) { status.innerHTML = ''; results.innerHTML = '<div class="ncm-empty">Nenhum NCM encontrado para este código.</div>'; return; }
            throw new Error('HTTP ' + res.status);
          }
          const data = await res.json();
          const items = Array.isArray(data) ? data : (data && data.codigo ? [data] : []);
          if (!items.length) { status.innerHTML = ''; results.innerHTML = '<div class="ncm-empty">Nenhum resultado encontrado.</div>'; return; }
          const limited = items.slice(0, 20);
          status.innerHTML = `<strong style="color:var(--violet-hi)">${items.length}</strong> NCM${items.length !== 1 ? 's' : ''} encontrado${items.length !== 1 ? 's' : ''}${items.length > 20 ? ' — exibindo 20' : ''}`;
          results.innerHTML = limited.map(buildNcmCard).join('');
          return;
        }

        // ── MODO TEXTO — busca inteligente ──
        const raw = val.trim();
        if (raw.length < 3) { status.innerHTML = '<span style="color:var(--muted)">Digite ao menos 3 caracteres.</span>'; return; }

        let found = [], strategy = '';

        // 1) Tentativa direta com termo original
        found = await apiSearch(raw);
        if (found.length) { strategy = ''; }

        // 2) Se não achou, normaliza (remove hifens/acentos) e tenta de novo
        if (!found.length) {
          const norm = ncmNorm(raw);
          if (norm !== raw.toLowerCase()) {
            found = await apiSearch(norm);
            if (found.length) strategy = `🔍 Buscado como <em>"${norm}"</em>`;
          }
        }

        // 3) Se ainda não achou, tenta cada palavra separada (≥3 chars), faz union e reordena por relevância
        if (!found.length) {
          const words = ncmNorm(raw).split(' ').filter(w => w.length >= 3);
          if (words.length > 1) {
            status.innerHTML = '<span class="ncm-spin"></span>Tentando variações...';
            const promises = words.map(w => apiSearch(w).catch(() => []));
            const batches = await Promise.all(promises);
            const merged = dedup(batches.flat());
            // Ordena por quantas palavras aparecem na descrição
            const scored = merged.map(it => ({ it, score: scoreItem(it, words) })).filter(x => x.score > 0);
            scored.sort((a, b) => b.score - a.score);
            found = scored.map(x => x.it);
            if (found.length) strategy = `🔍 Nenhum resultado exato — exibindo relacionados a <em>"${words.join(', ')}"</em>`;
          } else if (words.length === 1 && words[0] !== raw) {
            // single normalized word
            found = await apiSearch(words[0]);
            if (found.length) strategy = `🔍 Buscado como <em>"${words[0]}"</em>`;
          }
        }

        // 4) Fallback — palavras-raiz (stemming simples: remove últimas letras)
        if (!found.length) {
          const words = ncmNorm(raw).split(' ').filter(w => w.length >= 4);
          const stems = words.map(w => w.slice(0, -2)); // corta sufixo
          if (stems.length) {
            status.innerHTML = '<span class="ncm-spin"></span>Buscando por radicais...';
            const promises = stems.map(s => apiSearch(s).catch(() => []));
            const batches = await Promise.all(promises);
            const merged = dedup(batches.flat());
            const allWords = ncmNorm(raw).split(' ').filter(w => w.length >= 3);
            const scored = merged.map(it => ({ it, score: scoreItem(it, allWords) }));
            scored.sort((a, b) => b.score - a.score);
            found = scored.filter(x => x.score > 0).map(x => x.it);
            if (found.length) strategy = `🔍 Nenhum resultado exato — sugestões para <em>"${raw}"</em>`;
          }
        }

        if (!found.length) {
          status.innerHTML = '';
          results.innerHTML = `<div class="ncm-empty">
        Nenhum NCM encontrado para <strong>"${raw}"</strong>.<br>
        <span style="font-size:11px;color:var(--muted);margin-top:6px;display:block">
          Dica: tente palavras mais genéricas (ex: "pneu" ao invés de "pneu radial importado") ou use o código NCM diretamente.
        </span>
      </div>`;
          return;
        }

        const limited = found.slice(0, 20);
        const hint = strategy ? `<span style="font-size:11px;color:var(--muted);margin-left:8px">${strategy}</span>` : '';
        status.innerHTML = `<strong style="color:var(--violet-hi)">${found.length}</strong> NCM${found.length !== 1 ? 's' : ''} encontrado${found.length !== 1 ? 's' : ''}${found.length > 20 ? ' — exibindo 20' : ''}${hint}`;
        results.innerHTML = limited.map(buildNcmCard).join('');

      } catch (e) {
        status.innerHTML = '';
        const isLocal = location.protocol === 'file:';
        const isBlock = e instanceof TypeError;
        let msg, hint;
        if (isLocal && isBlock) {
          msg = 'Bloqueio de segurança do navegador';
          hint = 'Este arquivo está aberto localmente (<code>file://</code>). Por segurança, o navegador bloqueia requisições externas nesse modo.<br><strong>Solução:</strong> acesse pela URL do Vercel — <a href="https://cnae-iss-nbs.vercel.app" target="_blank" style="color:var(--violet-hi)">cnae-iss-nbs.vercel.app</a>';
        } else if (isBlock) {
          msg = 'Falha na conexão com a BrasilAPI';
          hint = 'Verifique sua internet ou tente novamente em instantes.';
        } else {
          msg = 'Erro: ' + e.message;
          hint = 'Tente novamente ou verifique sua conexão.';
        }
        results.innerHTML = `<div class="ncm-empty" style="color:#f87171;text-align:left;padding:24px 20px">
      <strong style="font-size:13px">⚠ ${msg}</strong><br>
      <span style="color:var(--muted);font-size:12px;line-height:1.8">${hint}</span>
    </div>`;
      }
    }


    const ncmInp = document.getElementById('ncm-q');

    ncmInp.addEventListener('input', e => {
      const val = e.target.value;
      clearTimeout(ncmTimer);
      // autocomplete apenas no modo código
      triggerAc(val);
      // busca principal com debounce maior
      ncmTimer = setTimeout(() => doNcmSearch(val), ncmMode === 'code' ? 500 : 600);
    });

    ncmInp.addEventListener('keydown', e => {
      const box = document.getElementById('ncm-autocomplete');
      if (box.style.display === 'none') return;
      if (e.key === 'ArrowDown') { e.preventDefault(); moveAc(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveAc(-1); }
      else if (e.key === 'Enter' && acIndex >= 0) { e.preventDefault(); pickAc(acIndex); }
      else if (e.key === 'Escape') { hideAc(); }
    });

    ncmInp.addEventListener('blur', () => { setTimeout(hideAc, 150); });

    // Exposição de dados para módulos externos (melhorias sem quebrar o legado)
    window.__CNAE_DATA__ = CNAE;
    window.__CEST_MAP__ = CEST_MAP;
    window.NBS_MAP = NBS_MAP;
    window.SIMPLES_MAP = SIMPLES_MAP;
  </script>
  <script type="module" src="./app-enhancements.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('SW Registered!', reg);
        }).catch(err => {
          console.log('SW Registration failed!', err);
        });
      });
    }

    // Hide splash screen after load
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('hidden');
      }, 1200);
    });
  </script>
</body>

</html>
